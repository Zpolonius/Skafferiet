<!DOCTYPE html>

<html lang="da"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tilføj vare</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS & Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {

                        "on-secondary-fixed-variant": "#683d00",
                        "inverse-primary": "#95d4b3",

                        "surface": "#f8f9fa",

                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#2c1700",
                        "inverse-surface": "#2e3132",
                        "tertiary": "#404a38",
                        "surface-container-highest": "#e1e3e4",
                        "background": "#f8f9fa",

                        "primary-fixed": "#b1f0ce",
                        "on-error": "#ffffff",
                        "on-background": "#191c1d",
                        "tertiary-fixed-dim": "#bfcab2",
                        "surface-variant": "#e1e3e4",
                        "on-tertiary-container": "#d1ddc4",
                        "tertiary-fixed": "#dbe7cd",
                        "surface-container-low": "#f3f4f5",
                        "secondary-fixed-dim": "#ffb86b",
                        "on-surface": "#191c1d",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f8f9fa",
                        "primary-container": "#2d6a4f",
                        "secondary": "#895100",
                        "on-surface-variant": "#404943",
                        "inverse-on-surface": "#f0f1f2",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",

                        "xl": "40px",
                        "sm": "8px",
                        "md": "16px",
                        "unit": "4px",
                        "container-margin": "20px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Be Vietnam Pro", "sans-serif"],
                        "label-sm": ["Be Vietnam Pro", "sans-serif"],
                        "body-md": ["Be Vietnam Pro", "sans-serif"],

                        "h1": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    "fontSize": {

                        "label-sm": ["13px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600"}],

<style>
        /* Custom styles to hide number input arrows for clean UI */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-white dark:bg-stone-900 border-b border-stone-100 dark:border-stone-800 shadow-sm shadow-emerald-900/5 flex items-center w-full px-5 h-16 sticky top-0 z-50">
<button aria-label="Gå tilbage" class="mr-4 active:scale-95 duration-200 hover:bg-stone-50 dark:hover:bg-stone-800 transition-colors p-2 rounded-full -ml-2">
<span class="material-symbols-outlined text-emerald-800 dark:text-emerald-400" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-semibold text-lg text-emerald-800 dark:text-emerald-400 flex-1 text-center pr-10">Tilføj vare</h1>
</header>
<!-- Main Content Canvas -->
<!-- Note: BottomNavBar is intentionally suppressed as per the "Automatic Suppression" rule for Task-Focused screens featuring a "Back" action. -->
<main class="flex-1 px-container-margin pt-6 pb-32 flex flex-col gap-8 max-w-2xl mx-auto w-full">
<!-- Image Upload/Capture Area -->
<section class="w-full">
<div class="w-full aspect-[4/3] md:aspect-[21/9] bg-surface-container-low rounded-xl border-2 border-dashed border-outline-variant flex flex-col items-center justify-center gap-3 cursor-pointer hover:bg-surface-container transition-colors group">
<div class="h-14 w-14 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-3xl group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Tilføj billede af varen</p>
</div>
</section>
<!-- Form Fields -->
<form class="flex flex-col gap-6">
<!-- Name Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant pl-1" for="item-name">Navn</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant shadow-sm shadow-primary/5" id="item-name" placeholder="F.eks. Økologisk Mælk" type="text"/>
</div>
<!-- Quantity & Unit -->
<div class="flex gap-4">
<!-- Quantity Picker (Custom Component) -->
<div class="flex flex-col gap-2 flex-1">
<label class="font-label-sm text-label-sm text-on-surface-variant pl-1">Mængde</label>
<div class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant rounded-lg p-2 shadow-sm shadow-primary/5">
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<input aria-label="Mængde" class="w-16 text-center font-body-lg text-body-lg text-on-surface bg-transparent border-none focus:ring-0 p-0" type="number" value="1"/>
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Unit Selector -->
<div class="flex flex-col gap-2 flex-1">
<label class="font-label-sm text-label-sm text-on-surface-variant pl-1" for="item-unit">Enhed</label>
<div class="relative w-full h-full">
<select class="w-full h-[58px] bg-surface-container-lowest border border-outline-variant rounded-lg px-4 appearance-none font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm shadow-primary/5 cursor-pointer" id="item-unit">
<option value="stk">stk</option>
<option value="liter">liter</option>
<option value="kg">kg</option>
<option value="g">gram</option>
<option value="pakke">pakke</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Category Selection (Chips) -->
<div class="flex flex-col gap-3 mt-2">
<label class="font-label-sm text-label-sm text-on-surface-variant pl-1">Kategori</label>
<div class="flex flex-wrap gap-sm">
<!-- Active Chip -->
<button class="px-5 py-2.5 rounded-full border border-primary bg-primary-container/20 text-primary font-label-sm text-label-sm transition-colors" type="button">
                        Mejeri
                    </button>
<!-- Inactive Chips -->
<button class="px-5 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low font-label-sm text-label-sm transition-colors" type="button">
                        Frugt &amp; Grønt
                    </button>
<button class="px-5 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low font-label-sm text-label-sm transition-colors" type="button">
                        Kød
                    </button>
<button class="px-5 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low font-label-sm text-label-sm transition-colors" type="button">
                        Kolonial
                    </button>
<button class="px-5 py-2.5 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low font-label-sm text-label-sm transition-colors" type="button">
                        Frost
                    </button>
<button class="px-5 py-2.5 rounded-full border border-dashed border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low font-label-sm text-label-sm transition-colors flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
                        Ny kategori
                    </button></div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-background/95 backdrop-blur-md p-container-margin border-t border-outline-variant/30 z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full h-14 rounded-xl bg-primary text-on-primary font-h2 text-[18px] flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-[0.98] transition-all shadow-sm shadow-primary/20">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
                Tilføj til liste
            </button>
</div>
</div>
</body></html>
