<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Kitchen Harmony - Opret opskrift</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#b1f0ce",
                        "on-tertiary-fixed-variant": "#3f4a37",
                        "outline-variant": "#bfc9c1",
                        "on-background": "#191c1d",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#dbe7cd",
                        "surface-dim": "#d9dadb",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-high": "#e7e8e9",
                        "on-primary-container": "#a8e7c5",
                        "surface-container-highest": "#e1e3e4",
                        "on-secondary-container": "#663b00",
                        "on-primary-fixed-variant": "#0e5138",
                        "primary-fixed-dim": "#95d4b3",
                        "error-container": "#ffdad6",
                        "background": "#f8f9fa",
                        "surface": "#f8f9fa",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e1e3e4",
                        "on-secondary-fixed": "#2c1700",
                        "inverse-on-surface": "#f0f1f2",
                        "tertiary": "#404a38",
                        "on-primary-fixed": "#002114",
                        "inverse-primary": "#95d4b3",
                        "surface-container-low": "#f3f4f5",
                        "outline": "#707973",
                        "secondary-fixed-dim": "#ffb86b",
                        "surface-container": "#edeeef",
                        "surface-bright": "#f8f9fa",
                        "inverse-surface": "#2e3132",
                        "on-surface": "#191c1d",
                        "primary": "#0f5238",
                        "secondary": "#895100",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#ffdcbc",
                        "primary-container": "#2d6a4f",
                        "surface-tint": "#2c694e",
                        "on-tertiary-container": "#d1ddc4",
                        "on-secondary-fixed-variant": "#683d00",
                        "on-tertiary-fixed": "#151e0f",
                        "tertiary-container": "#57624e",
                        "tertiary-fixed-dim": "#bfcab2",
                        "secondary-container": "#fd9d1a",
                        "on-surface-variant": "#404943"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xs": "4px",
                        "lg": "24px",
                        "xl": "40px",
                        "gutter": "16px",
                        "container-margin": "20px",
                        "unit": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "h2": ["Plus Jakarta Sans"],
                        "label-sm": ["Be Vietnam Pro"],
                        "h1": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-sm": ["13px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        /* Custom scrollbar to match fresh minimalism */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e1e3e4;
            border-radius: 9999px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased overflow-x-hidden min-h-screen flex flex-col">
<!-- TopAppBar -->
<!-- Content: Linear/Transactional intent, so navigation shell (BottomNavBar) is suppressed as per mandate -->
<!-- Also changing menu to arrow_back as requested by "back button" and contextual rules -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-5 h-16 bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 transition-colors duration-200 ease-in-out pt-safe shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-emerald-700 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-h2 text-h2 text-emerald-800 dark:text-emerald-300 flex-1 text-center truncate px-4">Opret opskrift</h1>
<div class="w-10 h-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-[calc(64px+env(safe-area-inset-top))] pb-[calc(80px+env(safe-area-inset-bottom))] px-container-margin w-full max-w-2xl mx-auto flex flex-col gap-lg mt-md">
<!-- Recipe Photo Upload Area -->
<section class="w-full aspect-[4/3] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container transition-colors group overflow-hidden relative">
<div class="flex flex-col items-center gap-sm text-on-surface-variant group-hover:text-primary transition-colors z-10 p-md text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
</div>
<span class="font-label-sm text-label-sm">Tilføj et indbydende billede</span>
<span class="font-body-md text-body-md text-sm opacity-70">JPEG eller PNG op til 5MB</span>
</div>
</section>
<!-- Recipe Name Input -->
<section class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="recipe-name">Opskriftens navn</label>
<input class="w-full h-12 bg-surface-container-low border-none rounded-lg px-md font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline outline-none" id="recipe-name" placeholder="F.eks. Cremet Tomatsuppe" type="text"/>
</section>
<!-- Category Selector (Chips) -->
<section class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">Kategori</label>
<div class="flex flex-wrap gap-sm">
<!-- Selected State -->
<button class="h-10 px-md rounded-full border border-primary bg-primary-fixed text-on-primary-fixed font-label-sm text-label-sm transition-colors flex items-center gap-xs">
                    Morgenmad
                </button>
<!-- Unselected States -->
<button class="h-10 px-md rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low font-label-sm text-label-sm transition-colors flex items-center gap-xs">
                    Frokost
                </button>
<button class="h-10 px-md rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low font-label-sm text-label-sm transition-colors flex items-center gap-xs">
                    Aftensmad
                </button>
<button class="h-10 px-md rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low font-label-sm text-label-sm transition-colors flex items-center gap-xs">
                    Snack
                </button>
</div>
</section>
<!-- Ingredients Section -->
<section class="flex flex-col gap-md bg-surface-container-lowest p-md rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.02)] border border-surface-container-highest">
<div class="flex justify-between items-center">
<h2 class="font-h2 text-h2 text-on-surface text-[20px]">Ingredienser</h2>
</div>
<div class="flex flex-col gap-sm">
<!-- Ingredient Row 1 -->
<div class="flex items-center gap-sm">
<button aria-label="Remove ingredient" class="w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-error hover:bg-error-container transition-colors shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">remove</span>
</button>
<input class="flex-1 h-12 bg-surface-container-low border-none rounded-lg px-md font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline outline-none min-w-[120px]" placeholder="Ingrediens" type="text" value="Hakkede tomater"/>
<input class="w-24 h-12 bg-surface-container-low border-none rounded-lg px-sm text-center font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline outline-none shrink-0" placeholder="Mængde" type="text" value="400g"/>
</div>
<!-- Ingredient Row 2 -->
<div class="flex items-center gap-sm">
<button aria-label="Remove ingredient" class="w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-error hover:bg-error-container transition-colors shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">remove</span>
</button>
<input class="flex-1 h-12 bg-surface-container-low border-none rounded-lg px-md font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline outline-none min-w-[120px]" placeholder="Ingrediens" type="text"/>
<input class="w-24 h-12 bg-surface-container-low border-none rounded-lg px-sm text-center font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline outline-none shrink-0" placeholder="Mængde" type="text"/>
</div>
</div>
<button class="w-full h-12 rounded-lg border-2 border-dashed border-primary text-primary font-label-sm text-label-sm hover:bg-primary-fixed hover:border-primary-fixed hover:text-on-primary-fixed transition-colors flex items-center justify-center gap-sm mt-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
                Tilføj ingrediens
            </button>
</section>
<!-- Bottom spacing for fixed button -->
<div class="h-20"></div>
</main>
<!-- Fixed Bottom Action Bar (Transactional Screen) -->
<div class="fixed bottom-0 w-full z-50 bg-surface-container-lowest/95 backdrop-blur-sm border-t border-surface-container-highest px-container-margin py-md pb-safe shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<div class="max-w-2xl mx-auto w-full">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-sm text-label-sm hover:bg-primary-container transition-colors flex items-center justify-center shadow-sm">
                Gem opskrift
            </button>
</div>
</div>
</body></html>
