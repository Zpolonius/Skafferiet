<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kitchen Harmony - Add Custom Meal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#dbe7cd",
                    "surface-bright": "#f8f9fa",
                    "on-primary-fixed-variant": "#0e5138",
                    "tertiary-fixed-dim": "#bfcab2",
                    "primary-container": "#2d6a4f",
                    "primary-fixed-dim": "#95d4b3",
                    "primary": "#0f5238",
                    "on-surface-variant": "#404943",
                    "surface-dim": "#d9dadb",
                    "secondary-fixed": "#ffdcbc",
                    "outline-variant": "#bfc9c1",
                    "on-secondary": "#ffffff",
                    "surface": "#f8f9fa",
                    "secondary-fixed-dim": "#ffb86b",
                    "surface-container-highest": "#e1e3e4",
                    "surface-container": "#edeeef",
                    "on-tertiary-container": "#d1ddc4",
                    "surface-container-low": "#f3f4f5",
                    "surface-container-high": "#e7e8e9",
                    "surface-tint": "#2c694e",
                    "primary-fixed": "#b1f0ce",
                    "on-primary-fixed": "#002114",
                    "outline": "#707973",
                    "inverse-surface": "#2e3132",
                    "background": "#f8f9fa",
                    "tertiary-container": "#57624e",
                    "on-background": "#191c1d",
                    "on-secondary-fixed": "#2c1700",
                    "surface-container-lowest": "#ffffff",
                    "on-surface": "#191c1d",
                    "error": "#ba1a1a",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#95d4b3",
                    "on-tertiary-fixed-variant": "#3f4a37",
                    "on-error-container": "#93000a",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#fd9d1a",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f0f1f2",
                    "tertiary": "#404a38",
                    "on-secondary-container": "#663b00",
                    "on-tertiary-fixed": "#151e0f",
                    "error-container": "#ffdad6",
                    "surface-variant": "#e1e3e4",
                    "secondary": "#895100",
                    "on-secondary-fixed-variant": "#683d00",
                    "on-primary-container": "#a8e7c5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "40px",
                    "md": "16px",
                    "gutter": "16px",
                    "unit": "4px",
                    "lg": "24px",
                    "xs": "4px",
                    "sm": "8px",
                    "container-margin": "20px"
            },
            "fontFamily": {
                    "label-sm": [
                            "Be Vietnam Pro"
                    ],
                    "h1": [
                            "Plus Jakarta Sans"
                    ],
                    "h2": [
                            "Plus Jakarta Sans"
                    ],
                    "body-md": [
                            "Be Vietnam Pro"
                    ],
                    "body-lg": [
                            "Be Vietnam Pro"
                    ]
            },
            "fontSize": {
                    "label-sm": [
                            "13px",
                            {
                                    "lineHeight": "1.2",
                                    "letterSpacing": "0.02em",
                                    "fontWeight": "600"
                            }
                    ],
                    "h1": [
                            "32px",
                            {
                                    "lineHeight": "1.2",
                                    "fontWeight": "700"
                            }
                    ],
                    "h2": [
                            "24px",
                            {
                                    "lineHeight": "1.3",
                                    "fontWeight": "600"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "1.5",
                                    "fontWeight": "400"
                            }
                    ],
                    "body-lg": [
                            "18px",
                            {
                                    "lineHeight": "1.6",
                                    "fontWeight": "400"
                            }
                    ]
            }
        },
        }
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background antialiased pt-16 pb-32">
<!-- TopAppBar (from JSON) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-5 h-16 bg-surface-lowest text-primary font-h2 border-b border-surface-container-high transition-colors duration-200 active:opacity-70">
<button class="mr-4 text-primary flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="close" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-h2 text-h2 font-bold flex-1 truncate text-primary-container">Add custom meal</h1>
</header>
<main class="px-container-margin mt-lg max-w-2xl mx-auto flex flex-col gap-lg"><!-- Recipe Photo Upload Area -->
<section class="w-full aspect-[4/3] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container transition-colors group overflow-hidden relative">
<div class="flex flex-col items-center gap-sm text-on-surface-variant group-hover:text-primary transition-colors z-10 p-md text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
</div>
<span class="font-label-sm text-label-sm">Tilføj et indbydende billede</span>
<span class="font-body-md text-body-md text-sm opacity-70">JPEG eller PNG op til 5MB</span>
</div>
</section>
<!-- Tabs/Segmented Control -->
<div class="flex p-unit bg-surface-container-low rounded-xl w-full">
<button class="flex-1 py-sm rounded-lg text-center font-label-sm text-label-sm text-on-surface-variant transition-colors duration-200">
                Søg opskrifter
            </button>
<button class="flex-1 py-sm rounded-lg text-center font-label-sm text-label-sm bg-surface-container-lowest text-primary shadow-sm transition-colors duration-200">
                Eget måltid
            </button>
</div>
<!-- Input Field: Meal Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant sr-only" for="meal-name">Meal Name</label>
<textarea class="w-full bg-surface-container-lowest border-none rounded-xl p-md font-body-lg text-body-lg text-on-background placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container resize-none shadow-[0px_2px_4px_rgba(45,106,79,0.05)]" id="meal-name" placeholder="Hvad skal I have at spise? (f.eks. Rugbrød med pålæg)" rows="2"></textarea>
</div>
<!-- Category Selector -->
<div class="flex flex-col gap-sm">
<h3 class="font-label-sm text-label-sm text-on-surface-variant">Kategori</h3>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm rounded-full font-label-sm text-label-sm bg-primary-container text-on-primary shadow-sm transition-transform active:scale-[0.98]">Aftensmad</button>
<button class="px-md py-sm rounded-full font-label-sm text-label-sm border border-outline-variant text-on-surface-variant hover:bg-surface-container-low transition-transform active:scale-[0.98]">Morgenmad</button>
<button class="px-md py-sm rounded-full font-label-sm text-label-sm border border-outline-variant text-on-surface-variant hover:bg-surface-container-low transition-transform active:scale-[0.98]">Frokost</button>
<button class="px-md py-sm rounded-full font-label-sm text-label-sm border border-outline-variant text-on-surface-variant hover:bg-surface-container-low transition-transform active:scale-[0.98]">Snack</button>
</div>
</div>
<!-- Quantity Selector -->
<div class="flex flex-col gap-sm">
<h3 class="font-label-sm text-label-sm text-on-surface-variant">Personer</h3>
<div class="flex items-center gap-md p-sm bg-surface-container-lowest rounded-xl shadow-[0px_2px_4px_rgba(45,106,79,0.05)] w-fit">
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary-container hover:bg-surface-container transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<div class="flex flex-col items-center w-12">
<span class="font-h2 text-h2 text-on-background">4</span>
<span class="font-label-sm text-[10px] text-outline-variant">pers.</span>
</div>
<button class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary hover:bg-primary transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
</div>
<!-- Notes Field -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="meal-notes">Noter (valgfrit)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-md font-body-md text-body-md text-on-background placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container focus:border-transparent resize-none transition-shadow" id="meal-notes" placeholder="Tilføj noter eller detaljer..." rows="3"></textarea>
</div>
<!-- Day Selector -->
<div class="flex flex-col gap-sm">
<h3 class="font-label-sm text-label-sm text-on-surface-variant">Vælg dag</h3>
<div class="flex gap-sm overflow-x-auto pb-sm snap-x no-scrollbar">
<!-- Day Card -->
<button class="flex flex-col items-center justify-center min-w-[72px] h-[80px] rounded-xl bg-surface-container-lowest border border-outline-variant text-on-surface-variant snap-center shrink-0 transition-transform active:scale-[0.98]">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Man</span>
<span class="font-h2 text-h2 mt-xs">12</span>
</button>
<!-- Day Card -->
<button class="flex flex-col items-center justify-center min-w-[72px] h-[80px] rounded-xl bg-surface-container-lowest border border-outline-variant text-on-surface-variant snap-center shrink-0 transition-transform active:scale-[0.98]">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Tir</span>
<span class="font-h2 text-h2 mt-xs">13</span>
</button>
<!-- Day Card (Selected) -->
<button class="flex flex-col items-center justify-center min-w-[72px] h-[80px] rounded-xl bg-primary-container text-on-primary border border-transparent shadow-[0px_4px_8px_rgba(45,106,79,0.15)] snap-center shrink-0 transition-transform active:scale-[0.98]">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-on-primary-container">Ons</span>
<span class="font-h2 text-h2 mt-xs">14</span>
</button>
<!-- Day Card -->
<button class="flex flex-col items-center justify-center min-w-[72px] h-[80px] rounded-xl bg-surface-container-lowest border border-outline-variant text-on-surface-variant snap-center shrink-0 transition-transform active:scale-[0.98]">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Tor</span>
<span class="font-h2 text-h2 mt-xs">15</span>
</button>
<!-- Day Card -->
<button class="flex flex-col items-center justify-center min-w-[72px] h-[80px] rounded-xl bg-surface-container-lowest border border-outline-variant text-on-surface-variant snap-center shrink-0 transition-transform active:scale-[0.98]">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Fre</span>
<span class="font-h2 text-h2 mt-xs">16</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar / Action Button (from JSON) -->
<div class="fixed bottom-0 left-0 w-full z-50 flex items-center justify-center px-5 pb-8 pt-4 bg-surface-lowest border-t border-surface-container-high shadow-[0_-4px_6px_-1px_rgba(45,106,79,0.05)] flex-col">
<div class="flex items-center gap-2 mb-4 w-full justify-center">
<input class="w-5 h-5 rounded border-outline text-primary-container focus:ring-primary-container focus:ring-offset-0 transition-colors cursor-pointer" id="save-as-recipe" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="save-as-recipe">
        Gem som opskrift
    </label>
</div><button class="flex flex-row items-center justify-center gap-2 bg-primary-container text-on-primary font-label-sm text-label-sm rounded-xl w-full py-3 hover:brightness-110 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
             Gem måltid
        </button>
</div>
<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</body></html>
